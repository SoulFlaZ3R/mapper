name: Build and Sign

on:
  push:
    tags:
      - "v*"
  # Collaudo manuale (scheda Actions → Run workflow): test, build e avvio di prova,
  # poi l'exe viene scartato. Nessun artifact, attestazione o release.
  # Manual check (Actions tab → Run workflow): tests, build and smoke test,
  # then the exe is discarded. No artifact, attestation or release.
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Solo il push di un tag pubblica qualcosa / Only a tag push publishes anything
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # Stesso spec di build/build.bat / Same spec as build/build.bat
      - name: Build exe
        working-directory: build
        run: pyinstaller --noconfirm --clean mapper.spec --distpath ../portable --workpath ./temp

      - name: Smoke-test packaged exe
        timeout-minutes: 2
        run: |
          $p = Start-Process portable/Mapper.exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Manual check summary
        if: env.RELEASE != 'true'
        run: |
          "Build, tests and smoke test passed. The exe was discarded: nothing was uploaded or published." | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Remove-Item portable/Mapper.exe

      - name: Upload unsigned artifact
        if: env.RELEASE == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Mapper-unsigned
          path: portable/Mapper.exe

      # ── SignPath code signing ──────────────────────────────────────
      # To enable signing, complete these steps:
      #
      # 1. Apply at https://signpath.org/apply for a free OSS certificate
      # 2. Once approved, create a project on app.signpath.io
      # 3. Add these GitHub repository secrets:
      #    - SIGNPATH_API_TOKEN: your SignPath API token
      # 4. Update the values below with your SignPath project details:
      #    - organization-id
      #    - project-slug
      #    - signing-policy-slug
      # 5. Uncomment the signing step
      #
      # - name: Sign with SignPath
      #   uses: SignPath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<your-org-id>"
      #     project-slug: "mapper"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: portable

      # Prova pubblica che l'exe nasce da questo sorgente / Public proof the exe was built from this source
      - name: Attest build provenance
        if: env.RELEASE == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: portable/Mapper.exe

      - name: SHA-256 checksum
        if: env.RELEASE == 'true'
        run: |
          $hash = (Get-FileHash portable/Mapper.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Mapper.exe" | Out-File -Encoding ascii portable/Mapper.exe.sha256

      - name: Create GitHub Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            portable/Mapper.exe
            portable/Mapper.exe.sha256
          generate_release_notes: true
